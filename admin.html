<!-- ไฟล์ admin.html - จัดการโครงสร้างหน้าเว็บ -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบผู้ดูแลระบบ</title>
    
    <!-- 🟢 เชื่อมไฟล์ CSS ตรงนี้ (ดึงความสวยงามมาใช้) -->
    <link rel="stylesheet" href="admin_styles.css">
</head>
<body>

    <div class="admin-container">
        <h2>Admin Login</h2>
        
        <div>
            <label for="adminUsername">ชื่อผู้ใช้:</label>
            <input type="text" id="adminUsername" placeholder="กรอกชื่อผู้ใช้">
        </div>
        
        <br>
        
        <div>
            <label for="adminPassword">รหัสผ่าน:</label>
            <input type="password" id="adminPassword" placeholder="กรอกรหัสผ่าน">
        </div>
        
        <br>
        
        <!-- ปุ่มนี้จะเรียกใช้ฟังก์ชัน checkAdminLogin() จากไฟล์ JavaScript -->
        <button class="btn-primary" onclick="checkAdminLogin()">เข้าสู่ระบบ</button>
    </div>

    <!-- 🟢 เชื่อมไฟล์ JavaScript ตรงนี้ (ดึงระบบทำงานมาใช้ - วางไว้ล่างสุดก่อนปิด body) -->
    <script src="admin_script.js"></script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบแบบประเมิน</title>
    <!-- นำเข้า LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .btn-line { background-color: #06C755; color: white; width: 100%; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-bottom: 15px; }
        .btn-email { background-color: white; color: #3b82f6; width: 100%; padding: 12px; border: 1px solid #3b82f6; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .modal { display: none; margin-top: 20px; text-align: left; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { background-color: #1d4ed8; color: white; width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="login-container">
    <h2 style="color: #1d4ed8;">เข้าสู่ระบบแบบประเมิน</h2>
    <p style="color: gray; font-size: 14px;">สำหรับอาจารย์ผู้ประเมิน</p>
    <br>

    <!-- ปุ่มล็อกอิน LINE -->
    <button class="btn-line" onclick="loginWithLine()">เข้าสู่ระบบด้วย LINE</button>
    
    <!-- ปุ่มล็อกอิน Email -->
    <button class="btn-email" onclick="toggleEmailModal()">เข้าสู่ระบบด้วย Email / เบอร์โทร</button>

    <!-- ฟอร์มกรอก Email/Phone -->
    <div class="modal" id="emailModal">
        <div class="input-group">
            <label>อีเมล (Username)</label>
            <input type="email" id="inputEmail" placeholder="อีเมลของคุณ">
        </div>
        <div class="input-group">
            <label>เบอร์โทรศัพท์ (Password)</label>
            <input type="text" id="inputPhone" placeholder="เบอร์โทรศัพท์ของคุณ">
        </div>
        <button class="btn-submit" onclick="loginWithEmail()">เข้าสู่ระบบ</button>
    </div>
</div>

<!-- สคริปต์ควบคุมการทำงาน -->
<script>
    const LIFF_ID = "2010763201-zDYpgg5r"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzztzVKjo66T95WJHOIir1QRR5JmPgnJv83ZLNM3dWtqZNnT_pDx4Ktu6O1-6-hm9Cy1w/exec"; 
    let userLineUID = ""; 

    window.onload = function() {
        liff.init({ liffId: LIFF_ID }).then(() => {
            if (liff.isLoggedIn()) {
                liff.getProfile().then(profile => {
                    userLineUID = profile.userId; 
                });
            }
        }).catch(err => console.error("LIFF Init Error: ", err));
    };

    // 🟢 ฟังก์ชันล็อกอิน LINE ฉบับดักจับบั๊ก (ปิดการเด้งไปหน้าอื่นชั่วคราว)
    async function loginWithLine() {
        if (!liff.isLoggedIn()) {
            liff.login(); 
            return;
        }

        const profile = await liff.getProfile();
        document.querySelector('.btn-line').innerText = "กำลังเข้าสู่ระบบ...";

        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "loginLine",
                    uid: profile.userId
                })
            });
            
            const rawText = await response.text();
            
            // 🟢 [DEBUG 1] แสดงข้อมูลจริงที่ได้รับกลับมาจาก Apps Script
            alert("1. ผลลัพธ์จากเซิร์ฟเวอร์:\n" + rawText);

            const result = JSON.parse(rawText);
            const userData = result.userData || result.user || result.data;

            if (userData) {
                // บันทึกทั้งสองแบบเพื่อกันเหนียว
                localStorage.setItem("assessorData", JSON.stringify(userData));
                sessionStorage.setItem("assessorData", JSON.stringify(userData));

                // 🟢 [DEBUG 2] เช็กว่าเครื่องเซฟสำเร็จไหม
                alert("2. บันทึกสำเร็จ! ข้อมูลในเครื่องคือ:\n" + localStorage.getItem("assessorData"));

                // 🔴 ปิดการย้ายหน้าไว้ เพื่อให้อ่าน Pop-up ทัน
                // window.location.href = "teacher.html"; 
            } else {
                alert("3. ล็อกอินผ่าน แต่หาตัวแปรข้อมูลอาจารย์ไม่เจอ");
            }
        } catch (error) {
            alert("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + error.message);
        } finally {
            document.querySelector('.btn-line').innerText = "เข้าสู่ระบบด้วย LINE";
        }
    }

    function toggleEmailModal() {
        const modal = document.getElementById("emailModal");
        modal.style.display = modal.style.display === "block" ? "none" : "block";
    }

    async function loginWithEmail() {
        const email = document.getElementById("inputEmail").value;
        const phone = document.getElementById("inputPhone").value;

        if (!email || !phone) {
            alert("กรุณากรอกข้อมูลให้ครบถ้วน");
            return;
        }

        document.querySelector('.btn-submit').innerText = "กำลังตรวจสอบ...";

        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: "loginEmail",
                    email: email,
                    phone: phone,
                    uid: userLineUID 
                })
            });
            const result = await response.json();

            const isSuccess = (result.status === "success" || result.result === "success");
            const userData = result.userData || result.user || result.data;

            if (isSuccess && userData) {
                localStorage.setItem("assessorData", JSON.stringify(userData));
                sessionStorage.setItem("assessorData", JSON.stringify(userData));
                window.location.href = "teacher.html";
            } else {
                alert("ระบบแจ้งว่า: " + (result.message || "อีเมลหรือเบอร์โทรศัพท์ไม่ถูกต้อง!"));
            }
        } catch (error) {
            alert("เกิดข้อผิดพลาดในการเชื่อมต่อ: " + error.message);
        } finally {
            document.querySelector('.btn-submit').innerText = "เข้าสู่ระบบ";
        }
    }
</script>

</body>
</html>
